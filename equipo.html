<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a0b2e">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <title>Nuestro equipo · Mayi Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="texts.js" defer></script>
  <script src="team.js" defer></script>
  <script src="equipo.js" defer></script>
</head>
<body class="page-team">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><img class="brand-logo" src="assets/logo-mayi-space.png" alt=""><span><span data-i18n="brandTitle">MAYI SPACE</span></span></a>
      <a class="resources-nav" href="index.html" data-i18n="backToGame">← Volver al juego</a>
      <div class="language-switch" role="group" aria-label="Language / Idioma">
        <button id="lang-es" type="button" aria-pressed="true" aria-label="Español" title="Español"><svg class="flag" viewBox="0 0 36 24" aria-hidden="true" focusable="false"><rect width="36" height="12" fill="#FCD116"/><rect y="12" width="36" height="6" fill="#003893"/><rect y="18" width="36" height="6" fill="#CE1126"/></svg></button>
        <button id="lang-en" type="button" aria-pressed="false" aria-label="English" title="English"><svg class="flag" viewBox="0 0 36 24" aria-hidden="true" focusable="false"><rect width="36" height="24" fill="#B22234"/><rect y="1.846" width="36" height="1.846" fill="#fff"/><rect y="5.538" width="36" height="1.846" fill="#fff"/><rect y="9.231" width="36" height="1.846" fill="#fff"/><rect y="12.923" width="36" height="1.846" fill="#fff"/><rect y="16.615" width="36" height="1.846" fill="#fff"/><rect y="20.308" width="36" height="1.846" fill="#fff"/><rect width="14.4" height="12.923" fill="#3C3B6E"/><circle cx="2.4" cy="2.2" r="0.75" fill="#fff"/><circle cx="6" cy="2.2" r="0.75" fill="#fff"/><circle cx="9.6" cy="2.2" r="0.75" fill="#fff"/><circle cx="13.2" cy="2.2" r="0.75" fill="#fff"/><circle cx="2.4" cy="6.1" r="0.75" fill="#fff"/><circle cx="6" cy="6.1" r="0.75" fill="#fff"/><circle cx="9.6" cy="6.1" r="0.75" fill="#fff"/><circle cx="13.2" cy="6.1" r="0.75" fill="#fff"/><circle cx="2.4" cy="10" r="0.75" fill="#fff"/><circle cx="6" cy="10" r="0.75" fill="#fff"/><circle cx="9.6" cy="10" r="0.75" fill="#fff"/><circle cx="13.2" cy="10" r="0.75" fill="#fff"/></svg></button>
      </div>
    </header>
    <main>
      <section class="team-section" aria-labelledby="team-heading">
        <h1 id="team-heading" data-i18n="teamHeading">Nuestro equipo</h1>
        <p class="team-lead" data-i18n="teamLead">Las personas que construyeron Mayi Space.</p>
        <ol id="team-grid" class="team-grid"></ol>
      </section>
    </main>
    <div id="team-modal" class="team-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div class="team-modal-panel">
        <button id="modal-close" class="modal-btn modal-close" type="button"><span aria-hidden="true">✕</span></button>
        <button id="modal-prev" class="modal-btn modal-prev" type="button"><span aria-hidden="true">‹</span></button>
        <button id="modal-next" class="modal-btn modal-next" type="button"><span aria-hidden="true">›</span></button>
        <figure class="modal-photo">
          <img id="modal-img" alt="">
          <span id="modal-number" class="team-number" aria-hidden="true"></span>
        </figure>
        <h2 id="modal-name"></h2>
        <p id="modal-role" class="team-role"><span id="modal-role-icon" class="team-role-icon" aria-hidden="true"></span><span id="modal-role-text"></span></p>
      </div>
    </div>    <footer><p data-i18n="footerNote">Los puntos son reglas del juego, no medidas reales.</p></footer>
  </div>

</html>
